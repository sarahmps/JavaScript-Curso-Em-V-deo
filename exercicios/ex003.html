<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miaaau</title>
    <style>
        body {
            background-color: rgb(248, 214, 221); /*comentario*/
            color: rgb(95, 48, 56);
            font: normal 20pt Arial;

                color:rgb(73, 121, 105)
            }
        }

<body>
   <h1>Soma Entre 2 Números</h1> <!--comentario-->
   <script>
   var n1 = Number(window.prompt('digite um número: ')) //string
   var n2 = Number(window.prompt('digite outro número: ')) //string
   var s = n1 + n2
   window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`) //ou String(s)
   window.document.write(`A soma entre ${n1} e ${n2} é igual a ${s}`)
   // (number + number) para adição
   // (string + string)para concatenação
   </script>
</body>
