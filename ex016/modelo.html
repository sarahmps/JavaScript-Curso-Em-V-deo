<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos contar</h1>
    </header>
    <section>
        <div id="in">
            <p>Início:
            <input type="number" name="txtIn" id="txtIn">
            </p>
        </div>
        <div id="f">
            <p>Fim:
            <input type="number" name="txtFim" id="txtFim" min="0">
            </p>
        </div>
        <div id="p">
            <p>Passo:
            <input type="number" name="txtP" id="txtP" min="0">
            </p>
        </div>
        <div id="botão">
            <input type="button" value="Contar" onclick="contador()">
        </div>
        <div id="msg">
            <p>Preparando a contagem...</p>
        </div>
    </section>
    <footer>
        <p>&copy; Cursoemvídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
